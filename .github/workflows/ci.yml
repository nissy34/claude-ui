name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check (server, scripts, Teams bridge)
        run: npm run check
      - name: Build the web UI
        run: npm run build
      - name: Projects engine end to end (fake CLI)
        run: npm test
      - name: Teams bridge end to end (fake CLI, fake Graph)
        run: npm run test:bridge
      - name: AI gateway mode (fake CLI, fake gateway)
        run: npm run test:gateway
      - name: Claude OAuth token login (fake CLI)
        run: npm run test:token
      - name: Chat-to-chat messaging test
        run: npm run test:sessions
      - name: PR status tests
        run: npm run test:pr

  ui:
    name: UI smoke test (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sign in, open a chat, send a message (desktop and phone)
        # Uses the Chrome that GitHub's Ubuntu image already has, so nothing is downloaded.
        run: CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:ui
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/ui-shots
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
